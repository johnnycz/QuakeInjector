plugins {
    id 'java'
    id 'eclipse'
    id 'application'
    id 'jacoco'
//    id 'com.palantir.graal' version '0.9.0'
    id "com.github.spotbugs" version "6.5.13"
    id 'edu.sc.seis.launch4j' version '2.5.0'
}

version = "git describe --tags".execute().text.trim()
repositories {
    mavenCentral()
}

dependencies {
    implementation 'edu.stanford.ejalbert:BrowserLauncher2:1.3'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.13.3'
    implementation 'org.apache.commons:commons-compress:1.27.1'
    implementation 'com.github.weisj:darklaf-core:2.7.3'
    // draws the SVG icons; darklaf brings the same version, but we use it directly
    implementation 'com.formdev:svgSalamander:1.1.2.4'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testImplementation 'com.tngtech.archunit:archunit:1.4.1'
}

application {
    mainClass.set('de.haukerehfeld.quakeinjector.QuakeInjector')
}

distributions {
    main {
        contents {
            // our license and those of the third-party material (icons)
            from("COPYING")
            from("licenses")
        }
    }
}

spotbugs {
    // pinned, so the findings don't change with a plugin update
    toolVersion = '4.10.5'
}

spotbugsMain {
    reports {
        // build/reports/spotbugs/main.html to read, main.xml for tools
        html { required = true }
        xml { required = true }
    }
}

jar {
    manifest {
        attributes["Main-Class"] = application.mainClass.get()
    }
    // our license and those of the third-party material (icons), next to the code they cover
    into("META-INF") {
        from("COPYING")
        from("licenses")
    }
}

//graal {
//    javaVersion "11"
//    graalVersion "21.1.0"
//    outputName "quake-injector"
//    mainClass application.mainClassName
//    option "--no-fallback"
//    option "--verbose"
//}

task readCommit(type: WriteProperties) {
    outputFile = file("${buildDir}/build-info.properties")
    comment = "Revision name"
    property("quake-injector.build-commit", version)
}

launch4j {
    mainClassName = application.mainClass.get()
    icon = "${projectDir}/src/main/resources/Inject2.ico"
    bundledJrePath "./runtime"
    bundledJre64Bit false
}

processResources {
    from(readCommit)
}

task downloadJre {
    def targetDir = "$buildDir/jre"
    def f = new File("$buildDir/jre.zip")
    f.parentFile.mkdir()
    if (!f.exists()) {
        new URL('https://github.com/adoptium/temurin17-binaries/releases/download/jdk-17.0.10%2B7/OpenJDK17U-jdk_x86-32_windows_hotspot_17.0.10_7.zip').withInputStream {i -> f.withOutputStream {it << i}}
    }

    copy {
        from zipTree("$buildDir/jre.zip")
        into(targetDir)
        fileMode 0777
        dirMode 0777
    }
}

task setupWinDist(type: Copy) {
    dependsOn("createExe", "downloadJre")
    group "distribution"
    def targetDir = "$buildDir/winDist"
    mkdir(targetDir)
    File jreDir
    doLast {
        copy {
            file("$buildDir/jre").eachDir {
                if (it.name.contains("jdk")) {
                    jreDir = it
                }
            }
            if (jreDir) {
                from(jreDir)
                into("$targetDir/runtime")
            }
        }
    }
    from("$buildDir/launch4j")
    // our license and those of the third-party material (icons)
    from("COPYING")
    from("licenses")
    into(targetDir)
}

task winDist(type: Zip) {
    dependsOn "setupWinDist"
    group "distribution"
    def distDir = "$buildDir/winDist"
    from "$distDir"
    archiveFileName = "QuakeInjector.exe-${project.version}.zip"
    exclude("*-jre")

}
test {
    useJUnitPlatform()
    maxParallelForks = 1
}

jacoco {
    // pinned, like spotbugs
    toolVersion = '0.8.13'
}

jacocoTestReport {
    dependsOn test
    reports {
        // build/reports/jacoco/test/html/index.html to read, xml/csv for tools
        html.required = true
        xml.required = true
        csv.required = true
    }
}
